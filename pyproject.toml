[project]
name = "wikimind"
version = "0.2.0"
description = "LLM-powered wiki that maintains itself"
requires-python = ">=3.11"

dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "anthropic>=0.40",
    "python-frontmatter>=1.1",
    "python-slugify>=8.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
pdf = ["pymupdf4llm>=0.0.10"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[project.scripts]
wikimind = "wikimind.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Declare the payload explicitly. Hatchling infers sdist contents from
# .gitignore, but it does not read .git/info/exclude — which let 1,280 files
# of .opencode/node_modules (4 MB of unrelated JS) into the 0.2.0 sdist.
[tool.hatch.build.targets.wheel]
packages = ["wikimind"]

[tool.hatch.build.targets.sdist]
include = [
    "/wikimind",
    "/tests",
    "/docs",
    "/scripts",
    "/README.md",
    "/CLAUDE.md",
    "/CHEATSHEET.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
